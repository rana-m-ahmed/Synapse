name: Keep Hugging Face Space Alive

on:
  schedule:
    # Run every 15 minutes to keep the space active
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hugging Face Space Health Endpoint
        run: |
          curl -s -L -o /dev/null -w "%{http_code}" https://rana-m-ahmed-synapse-backend.hf.space/health
